      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="150" r="300" fill="#0284c7" opacity="0.12" filter="blur(80px)"/>
  <circle cx="150" cy="500" r="250" fill="#10b981" opacity="0.1" filter="blur(70px)"/>
  
  <!-- Isometric Concrete Cube Icon -->
  <g transform="translate(100, 180) scale(3.2)">
